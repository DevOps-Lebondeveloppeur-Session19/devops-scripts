# Define the name of the Docker Compose project
name: postgres-stack

# Services section defines all the containers in the stack
services:
  # postgres service definition
  postgres:
    container_name: postgres
    # Pin the major version. Never use :latest for a database — a re-provision
    # can silently cross a major version (17 -> 18) and break the data layout.
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=pass-123
      - POSTGRES_DB=app-db
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a version-specific subdir; mount the parent
      # (/var/lib/postgresql), NOT /var/lib/postgresql/data.
      - postgres-volume:/var/lib/postgresql
    networks:
      - backend-api-net

  # pgadmin service definition
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=pass-123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend-api-net

# Volumes section defines named volumes for persistent data
volumes:
  postgres-volume:

# Networks section defines the networks used by the containers
networks:
  backend-api-net:
    name: backend-api-net
