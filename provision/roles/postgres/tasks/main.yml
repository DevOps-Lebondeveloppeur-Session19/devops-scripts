# Install pip3 (Python package manager)
- name: Install pip3
  apt:
    name: python3-pip
    state: present
  become: true

# Install the docker Python module via apt
- name: Install docker Python module via apt
  apt:
    name: python3-docker
    state: present
  become: true

# Create a directory to store the Docker Compose configuration for PostgreSQL
- name: Create postgres-compose directory
  file:
    path: /opt/postgres-stack
    state: directory
    mode: '0755'

# Copy the Docker Compose file from the templates directory to the target machine
- name: Deploy Docker Compose file
  template:
    src: postgres-compose.yml
    dest: /opt/postgres-stack/docker-compose.yml
    mode: '0644'

# Deploy the PostgreSQL stack using Docker Compose v2
- name: Deploy PostgreSQL with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: /opt/postgres-stack
    state: present
