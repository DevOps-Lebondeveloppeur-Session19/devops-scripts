    # Install required dependencies for Docker
    - name: Install required dependencies for Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    # Ensure the keyrings directory exists (apt-key is removed on modern Ubuntu/Debian)
    - name: Create /etc/apt/keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # Add Docker's official GPG key (modern keyring approach, no apt-key)
    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # Detect the target's architecture for the repo line
    - name: Determine dpkg architecture
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    # Add Docker repository (references the key with signed-by)
    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release | lower }} stable"
        filename: docker
        state: present

    # Install Docker
    - name: Install Docker
      apt:
        name: docker-ce
        state: latest

    # Start and enable Docker service
    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    # Install Docker Compose Plugin (integrated with Docker)
    - name: Install Docker Compose Plugin
      apt:
        name: docker-compose-plugin
        state: present

    # Verify Docker installation
    - name: Verify Docker installation
      command: docker --version
      register: docker_version
      changed_when: false

    # Verify Docker Compose installation
    - name: Verify Docker Compose installation
      command: docker compose version
      register: compose_version
      changed_when: false

    # Show Docker version
    - name: Show Docker version
      debug:
        msg: "Docker version: {{ docker_version.stdout }}"
        
    # Show Docker Compose version
    - name: Show Docker Compose version
      debug:
        msg: "Docker Compose version: {{ compose_version.stdout }}"